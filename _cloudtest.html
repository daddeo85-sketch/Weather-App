<!doctype html><meta name=viewport content="width=device-width"><style>
body{margin:0} .sky{position:relative;height:300px;overflow:hidden;--cloud: rgba(255,255,255,0.92);--cloud-shade: rgba(205,220,234,0.9);background:linear-gradient(#3a7bd5,#9cc6f0)}
.sky.wx-rain{--cloud: rgba(92,101,116,0.95); --cloud-shade: rgba(58,66,80,0.9);background:linear-gradient(#6b7685,#a3adb9)}
.sky.night{--cloud: rgba(70,82,100,0.75); --cloud-shade: rgba(40,50,66,0.7);background:linear-gradient(#0d1424,#1c2a40)}
.cloud { position: absolute; width: 380px; height: 150px; margin-top: -60px; animation: drift linear infinite; transition: opacity 2s;
  background:
    radial-gradient(ellipse 46% 20% at 50% 80%, var(--cloud-shade) 0%, transparent 100%),
    radial-gradient(ellipse 16% 26% at 24% 60%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 18% 34% at 36% 46%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 20% 40% at 50% 36%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 17% 32% at 63% 45%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 15% 26% at 75% 56%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 10% 16% at 87% 66%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 11% 18% at 13% 68%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 24% 26% at 43% 60%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 24% 24% at 59% 62%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 20% 16% at 30% 70%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 20% 16% at 70% 70%, var(--cloud) 0%, transparent 74%),
    radial-gradient(ellipse 48% 18% at 50% 70%, var(--cloud) 20%, transparent 92%);
  filter: blur(3.5px); }
.cloud::before { content: ""; position: absolute; left: -16%; right: -16%; top: 58%; height: 26%;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, var(--cloud) 0%, transparent 72%); opacity: 0.45; filter: blur(7px); }

.cloud{animation:none}
</style>
<div class=sky><div class=cloud style="left:0px;top:70px"></div><div class=cloud style="left:300px;top:130px;transform:scale(0.7,0.6) scaleX(-1)"></div></div>
<div class="sky wx-rain"><div class=cloud style="left:0px;top:70px"></div><div class=cloud style="left:300px;top:130px;transform:scale(0.9,0.75) scaleX(-1)"></div></div>
<div class="sky night"><div class=cloud style="left:0px;top:70px"></div></div>
