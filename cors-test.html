<div id="o"></div>
<script>
var T=[
["mdapi","https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=tidepredictions"],
["nomZip","https://nominatim.openstreetmap.org/search?postalcode=34950&country=us&format=json&limit=1"],
["nomQ","https://nominatim.openstreetmap.org/search?q=Fort%20Pierce%20Walmart&countrycodes=us&format=json&limit=1"],
["omZip","https://geocoding-api.open-meteo.com/v1/search?name=34950&count=3&countryCode=US"],
["rawBuoy","https://raw.githubusercontent.com/daddeo85-sketch/Weather-App/data/buoys.json"],
["adsblol","https://api.adsb.lol/v2/point/27.45/-80.33/40"],

["omMarineSST","https://marine-api.open-meteo.com/v1/marine?latitude=27.56&longitude=-80.22&current=wave_height,sea_surface_temperature"]
];

T.forEach(function(t){var d=document.createElement("div");d.textContent=t[0]+": ...";o.appendChild(d);
fetch(t[1]).then(function(r){return r.text().then(function(x){d.textContent=t[0]+": "+r.status+" "+x.length+" "+x.slice(0,160).replace(/\s+/g," ");});}).catch(function(e){d.textContent=t[0]+": FAIL "+e;});});

["https://cdn.star.nesdis.noaa.gov/GOES18/ABI/SECTOR/psw/GEOCOLOR/GOES18-PSW-GEOCOLOR-600x600.gif","https://cdn.star.nesdis.noaa.gov/GOES19/ABI/SECTOR/ne/GEOCOLOR/GOES19-NE-GEOCOLOR-600x600.gif"].forEach(function(u){var i=new Image();i.width=80;i.onload=function(){o.appendChild(document.createTextNode(" IMG OK "+u.slice(-30)))};i.onerror=function(){o.appendChild(document.createTextNode(" IMG FAIL "+u.slice(-30)))};i.src=u;});
</script>
