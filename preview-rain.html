<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Rain graph preview</title><style>
/* ---------- Theme tokens ---------- */
:root {
  --fs: 1;
  --sky-top: #3f86c4;
  --sky-mid: #7fb6e2;
  --sky-low: #cfe4f4;
  --cloud: rgba(255,255,255,0.92);
  --cloud-shade: rgba(205,220,234,0.9);
  --panel: rgba(255,255,255,0.86);
  --panel-solid: #ffffff;
  --fg: #10222e;
  --muted: #536674;
  --line: rgba(16,34,46,0.14);
  --accent: #1f6fa8;
  --accent-fg: #ffffff;
  --good: #1f8a4c;
  --warn: #b7791f;
  --bad: #c0392b;
  --chip: rgba(255,255,255,0.7);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sky-top: #060f1c;
    --sky-mid: #10233a;
    --sky-low: #1d3550;
    --cloud: rgba(120,142,166,0.30);
    --cloud-shade: rgba(70,92,118,0.28);
    --panel: rgba(14,26,38,0.82);
    --panel-solid: #0e1a26;
    --fg: #e6eef4;
    --muted: #94a8b6;
    --line: rgba(230,238,244,0.14);
    --accent: #58aee8;
    --accent-fg: #06131b;
    --good: #3cc47a;
    --warn: #e2b24a;
    --bad: #ff6b5b;
    --chip: rgba(20,36,52,0.75);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  color: var(--fg);
  font: calc(15px * var(--fs))/1.45 var(--font);
  background: var(--sky-top);
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); }
h2 { font-size: calc(19px * var(--fs)); margin: 0 0 4px; }
h3 { font-size: calc(15px * var(--fs)); margin: 14px 0 6px; }
p { margin: 6px 0; }
.small { font-size: calc(12.5px * var(--fs)); color: var(--muted); }
.muted { color: var(--muted); }

/* ---------- Page layout ---------- */
.page {
  position: relative; z-index: 1;
  max-width: 760px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(16px, env(safe-area-inset-left, 0px));
}
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.35); margin: 4px 2px 10px; }
.top h1 { margin: 0; font-size: calc(24px * var(--fs)); line-height: 1.1; }
.top .sub { font-size: calc(12.5px * var(--fs)); opacity: 0.88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl > div { min-width: 0; }
@media (max-width: 420px) { .ttl { flex-direction: column; align-items: flex-start; gap: 4px; } .top .sub { font-size: calc(11.5px * var(--fs)); } }
nav.jump {
  position: sticky; top: 0; z-index: 900;
  display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px; margin: 0 -2px 6px;
  scrollbar-width: none;
}
nav.jump::-webkit-scrollbar { display: none; }
nav.jump a {
  flex: none; text-decoration: none; color: var(--fg); background: var(--chip);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: calc(13px * var(--fs)); font-weight: 600;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 14px 14px 16px; margin: 0 0 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  scroll-margin-top: 56px;
}
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn, .links a {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel-solid); color: var(--fg); font: 600 calc(14px * var(--fs)) var(--font); text-decoration: none; cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn:focus-visible, .links a:focus-visible, nav.jump a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
img.wide { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-solid); }
details > summary { cursor: pointer; font-weight: 600; color: var(--accent); padding: 6px 0; }
.err { color: var(--bad); font-size: calc(13px * var(--fs)); }

/* ---------- Alerts ---------- */
.alert { border-left: 6px solid var(--warn); }
.alert.warning { border-left-color: var(--bad); }
.alert .ev { font-weight: 700; font-size: calc(16px * var(--fs)); }
.alert pre { white-space: pre-wrap; font: calc(13.5px * var(--fs))/1.45 var(--font); margin: 6px 0 0; }

/* ---------- Now ---------- */
.now-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.big-temp { font-size: calc(60px * var(--fs)); font-weight: 800; line-height: 1; letter-spacing: -2px; }
.cond { font-size: calc(17px * var(--fs)); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(110px * var(--fs)), 1fr)); gap: 8px; margin-top: 12px; }
#waveNow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#waveNow .tile:nth-child(3) { grid-column: 1 / -1; }
.tile { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.tile .k { font-size: calc(12px * var(--fs)); color: var(--muted); }
.tile .v { font-size: calc(18px * var(--fs)); font-weight: 700; font-variant-numeric: tabular-nums; }
.periods { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-bottom: 4px; scrollbar-width: thin; }
.tile .s { font-size: calc(12px * var(--fs)); color: var(--muted); margin-top: 3px; line-height: 1.3; }
.mtag { display: inline-block; font-size: calc(10.5px * var(--fs)); font-weight: 800; padding: 2px 7px; border-radius: 999px; color: #fff; text-transform: uppercase; letter-spacing: .03em; margin: 2px 4px 0 0; vertical-align: middle; }
.mtag.super { background: #d35400; } .mtag.micro { background: #6b7c88; } .mtag.blue { background: #1f6fa8; }
.mtag.black { background: #2c3e50; } .mtag.blood { background: #a93226; } .mtag.ecl { background: #8e44ad; }
.tag.rip-high { background: #c0392b; } .tag.rip-mod { background: #d68910; } .tag.rip-low { background: #27ae60; }
.moon-lines > div { margin-top: 4px; }
.period { flex: none; width: calc(118px * var(--fs)); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.period .n { font-size: calc(12.5px * var(--fs)); font-weight: 700; }
/* Hour-by-hour in the detail screens: every hour on screen at once, no sideways scrolling */
.periods.hrs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; overflow: visible; }
.periods.hrs .period { width: auto; padding: 6px 7px; border-radius: 10px; }
.periods.hrs .period .n { font-size: calc(11.5px * var(--fs)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.periods.hrs .period .t { font-size: calc(17px * var(--fs)); }
.periods.hrs .period .s { font-size: calc(11px * var(--fs)); }
.period .t { font-size: calc(22px * var(--fs)); font-weight: 800; }
.period .s { font-size: calc(12px * var(--fs)); color: var(--muted); line-height: 1.3; }
.period .p { font-size: calc(12px * var(--fs)); color: var(--accent); font-weight: 600; }
.period .p .amt { font-weight: 700; }
.rainday { margin-top: 14px; }
.rainday .rdhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rainday .rdhead h3 { margin: 0; }
.rainday .rdhead span { font-size: calc(13px * var(--fs)); font-weight: 700; color: var(--accent); }
.rdrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0 2px; }
.rdrow::-webkit-scrollbar { display: none; }
.rh { flex: none; min-width: calc(54px * var(--fs)); text-align: center; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; font-size: calc(12px * var(--fs)); line-height: 1.5; }
.rh .n { font-weight: 700; white-space: nowrap; }
.rh .a { font-size: calc(14px * var(--fs)); font-weight: 800; }
.rh .c, .rh .r { color: var(--muted); }
.rh.wet .a { color: var(--accent); }
.rh.lbl { background: none; border-color: transparent; text-align: left; min-width: 0; padding-left: 0; }
.rh.lbl .a { font-size: calc(12px * var(--fs)); font-weight: 600; color: var(--muted); }
#rainDayRow { display: block; overflow: visible; }
.rg { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; align-items: end; }
.rgc { text-align: center; min-width: 0; font-size: calc(11px * var(--fs)); line-height: 1.35; }
.rgv { font-size: calc(10px * var(--fs)); font-weight: 800; color: var(--accent); white-space: nowrap; letter-spacing: -0.02em; }
.rgb { height: 84px; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--line); margin: 2px 0 4px; }
.rgb i { display: block; width: 72%; max-width: 22px; background: var(--accent); border-radius: 4px 4px 0 0; }
.rgh { font-weight: 700; }
.rgap { font-size: calc(9px * var(--fs)); color: var(--muted); font-weight: 600; }
.rgp { color: var(--muted); font-size: calc(10px * var(--fs)); }
.rgk { margin-top: 6px; font-size: calc(11px * var(--fs)); color: var(--muted); }

/* ---------- Radar ---------- */
.mapwrap { position: relative; height: 58vh; min-height: 340px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.mapwrap.full { position: fixed; inset: 0; height: auto; min-height: 0; z-index: 2000; border-radius: 0; border: 0; }
body.mapfull .page { z-index: auto; }
body.mapfull .card { backdrop-filter: none; -webkit-backdrop-filter: none; }
body.mapfull .tabbar, body.mapfull .install { display: none; }
#map, #tmap { position: absolute; inset: 0; background: var(--panel-solid); }
.mapbtns { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
.mapwrap.full .mapbtns { top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); }
.mapbtns .btn { width: 42px; height: 42px; min-height: 0; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.mapbtns .btn.on { background: #1f6fa8; color: #fff; }
.lyrmenu { position: absolute; top: 10px; right: 62px; z-index: 1001; width: min(260px, calc(100% - 80px)); background: #fff; color: #14202e; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); padding: 6px 12px 8px; font-size: calc(14px * var(--fs)); }
.mapwrap.full .lyrmenu { top: calc(env(safe-area-inset-top, 0px) + 112px); right: calc(env(safe-area-inset-right, 0px) + 10px); }
.lyrmenu h4 { margin: 4px 0 2px; font-size: calc(12px * var(--fs)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #5b6b7d; }
.lyrmenu label { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #e6ebf1; cursor: pointer; }
.lyrmenu label:first-of-type { border-top: 0; }
.lyrmenu label.off { opacity: 0.5; cursor: default; }
.lyrmenu .ln { display: flex; align-items: center; gap: 9px; line-height: 1.2; }
.lyrmenu .ln small { display: block; color: #5b6b7d; font-size: calc(11.5px * var(--fs)); }
.lyrmenu .sq { width: 14px; height: 14px; border-radius: 3px; flex: none; }
.lyrmenu input { width: 20px; height: 20px; accent-color: #1f6fa8; flex: none; }
.lyrmenu .lnote { margin: 4px 0 0; font-size: calc(11.5px * var(--fs)); color: #5b6b7d; }
.dock { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 1000; }
.mapwrap.full .dock { bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
.dock-inner {
  max-width: 520px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 4px 14px rgba(0,0,0,0.2);
}
.play { grid-row: span 2; width: 46px; height: 46px; min-height: 0; padding: 0; border-radius: 50%; background: var(--accent); color: var(--accent-fg); border: none; }
.timerow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rtime { font-size: calc(16px * var(--fs)); font-weight: 700; font-variant-numeric: tabular-nums; }
.ago { font-size: calc(12.5px * var(--fs)); color: var(--muted); white-space: nowrap; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 26px; margin: 0; }
.legend { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: calc(11px * var(--fs)); color: var(--muted); }
.legend .bar { flex: 1; height: 7px; border-radius: 4px; background: linear-gradient(90deg, #88ddee, #0099cc, #0077aa, #005588, #ffee00, #ffaa00, #ff4400, #c10000, #ffaaff, #ff77ff); }
.leaflet-control-attribution { font-size: calc(10px * var(--fs)); }
#radarWrap .leaflet-bottom { bottom: 112px; }
.sliderwrap { position: relative; padding-bottom: 9px; }
.play svg[hidden] { display: none; }
.nowmark { position: absolute; bottom: -2px; transform: translateX(-50%); font-size: 9.5px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.4px; line-height: 1; pointer-events: none; }
.nowmark i { position: absolute; left: 50%; bottom: 11px; width: 2px; height: 14px; margin-left: -1px; background: var(--accent); border-radius: 1px; }
.ago.fut { color: #fff; background: #7b4dd6; padding: 1px 7px; border-radius: 999px; font-weight: 700; }
.legend .bar.nws { background: linear-gradient(90deg, #04e9e7, #019ff4, #02fd02, #01c501, #008e00, #fdf802, #e5bc00, #fd9500, #fd0000, #bc0000, #f800fd); }
.me-dot { width: 16px; height: 16px; border-radius: 50%; background: #1f8bff; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(31,139,255,0.35); }

/* ---------- Why it's raining ---------- */
.keymsgs { margin: 6px 0 0; padding-left: 20px; }
.keymsgs li { margin: 0 0 8px; }
.fronts { display: grid; grid-template-columns: 54px 1fr; gap: 6px 10px; align-items: center; font-size: calc(14px * var(--fs)); margin-top: 8px; }
.fronts svg { width: 54px; height: 22px; }
.afd { white-space: pre-wrap; font: calc(13.5px * var(--fs))/1.5 var(--font); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 10px; max-height: 50vh; overflow: auto; }

/* ---------- Tides ---------- */
.tide-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(150px * var(--fs)), 1fr)); gap: 8px; }
.tide { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.tide .ty { font-size: calc(12px * var(--fs)); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.tide.H .ty { color: var(--accent); }
.tide.L .ty { color: var(--muted); }
.tide .tm { font-size: calc(18px * var(--fs)); font-weight: 700; }
.tide.past { opacity: 0.5; }
#tidechart { width: 100%; height: auto; display: block; margin: 6px 0 4px; }
.tidenow { font-weight: 700; font-size: calc(16px * var(--fs)); margin: 2px 0 6px; }
.events { list-style: none; padding: 0; margin: 6px 0 0; }
.events li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.events li:first-child { border-top: 0; }
.tag { flex: none; font-size: calc(11.5px * var(--fs)); font-weight: 800; padding: 3px 8px; border-radius: 999px; color: #fff; text-transform: uppercase; letter-spacing: .03em; }
.tag.king { background: #c0392b; }
.tag.spring { background: #1f6fa8; }
.tag.neap { background: #6b7c88; }
.tag.high { background: #8e44ad; }

/* ---------- Sun & moon ---------- */
.sun-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(130px * var(--fs)), 1fr)); gap: 8px; }
.moonrow { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
.moonrow svg { width: 86px; height: 86px; flex: none; }

/* ---------- Traffic ---------- */
.routes { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.routes .btn.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.rainamt { margin-top: 3px; font-weight: 600; color: var(--fg); }
.waze { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.planego { display: flex; align-items: center; gap: 14px; margin: 10px 0 4px; padding: 16px; border-radius: 14px; background: var(--accent); color: var(--accent-fg); text-decoration: none; }
.planego svg { flex: none; width: 34px; height: 34px; fill: currentColor; transform: rotate(45deg); }
.planego b { display: block; font-size: calc(17px * var(--fs)); }
.planego span span { display: block; font-size: calc(13px * var(--fs)); opacity: .9; margin-top: 2px; }
.tkey { display: flex; gap: 12px; flex-wrap: wrap; font-size: calc(13px * var(--fs)); margin: 8px 0 0; align-items: center; }
.tkey i { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }
.crash-ic { width: 30px; height: 30px; border-radius: 50%; background: #c0392b; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
.crash-ic.other { background: #e67e22; }
.crash-ic svg { width: 20px; height: 20px; fill: #fff; }
.routeinfo { font-weight: 600; margin-top: 6px; }
.rmapwrap { height: 34vh; min-height: 220px; margin: 8px 0; }
#rmap { position: absolute; inset: 0; background: var(--panel-solid); }
.routeform input { width: 100%; box-sizing: border-box; min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel-solid); color: var(--fg); font: calc(16px * var(--fs)) var(--font); }
.routeform .frow input { width: auto; }
.rthead { align-items: center; flex-wrap: wrap; }
.rtbtns { display: flex; gap: 6px; flex-wrap: wrap; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }

/* ---------- Hurricanes ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(140px * var(--fs)), 1fr)); gap: 8px; margin: 8px 0; }
.stat .v { font-size: calc(26px * var(--fs)); font-weight: 800; }
.stat .vs { font-size: calc(12px * var(--fs)); color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.stormlist { columns: 2; column-gap: 18px; padding-left: 18px; margin: 6px 0; }
.active { border-left: 6px solid var(--bad); padding-left: 10px; margin: 8px 0; }
#hurricanes-off summary { font-size: calc(17px * var(--fs)); }
/* ---------- Settings ---------- */
.hbtns { display: flex; gap: 8px; }
.sheet { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-card { background: var(--panel-solid); color: var(--fg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; box-sizing: border-box;
  border-radius: 18px 18px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 600px) { .sheet { align-items: center; } .sheet-card { border-radius: 18px; } }
.sheet input { width: 100%; box-sizing: border-box; min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel-solid); color: var(--fg); font: calc(16px * var(--fs)) var(--font); }
.frow { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.frow input { flex: 1; min-width: 0; width: auto; }
.fstack { display: grid; gap: 8px; margin-top: 8px; }
.results { display: grid; gap: 6px; }
.results .btn { justify-content: flex-start; text-align: left; padding: 8px 12px; }
.placebox { background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: calc(13px * var(--fs)); line-height: 1.45; }
/* ---------- Maps on phones: one finger scrolls the page ---------- */
.maphint { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 1100; background: rgba(0,0,0,0.72); color: #fff;
  padding: 10px 14px; border-radius: 12px; font: 600 calc(14px * var(--fs)) var(--font); pointer-events: none; opacity: 0; transition: opacity .2s; text-align: center; max-width: 80%; }
