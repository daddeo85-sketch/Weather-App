name: Buoy and tide station data

# Every 30 minutes: save the latest NOAA buoy readings (and, weekly, the tide
# station list) to the "data" branch for the weather page to read.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buoy-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Get the last saved data
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data; then
            for f in buoys.json tides.json; do git show "origin/data:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"; done
          fi

      - name: Fetch buoys and tide stations
        run: python3 .github/scripts/fetch_data.py out

      - name: Save to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Buoy data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
